# À chaque tag vX.Y.Z (ou à la main depuis l'onglet Actions) :
# construit l'APK Android avec Capacitor, le signe avec la clé stable du dépôt,
# et le publie dans une Release « Mom's games vX.Y.Z » sous le nom moms-games.apk.
name: APK Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la clé de signature est configurée
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MDP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ] || [ -z "$ALIAS" ]; then
            echo "::error::Secrets de signature absents (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Voir le README, partie « Signature de l'APK »."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lire la version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION de package.json. Utiliser « npm run nouvelle-version -- X.Y.Z » avant de créer le tag."
            exit 1
          fi

      - name: Préparer le projet Android
        run: |
          node scripts/preparer-site.mjs www
          npx cap add android
          node scripts/configurer-android.mjs
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MDP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/cle.jks"
          OUTILS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$OUTILS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligne.apk"
          "$OUTILS/apksigner" sign --ks "$RUNNER_TEMP/cle.jks" --ks-key-alias "$ALIAS" \
            --ks-pass env:MDP --key-pass env:MDP --out moms-games.apk "$RUNNER_TEMP/aligne.apk"
          "$OUTILS/apksigner" verify --print-certs moms-games.apk
          rm -f "$RUNNER_TEMP/cle.jks"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mom's games v${{ steps.version.outputs.version }}
          files: moms-games.apk
          make_latest: true
          body: |
            **Pour installer sur Android :** touchez `moms-games.apk` ci-dessous, puis suivez le README (partie « Pour ma maman »).

            Lien direct, toujours vers la dernière version :
            https://github.com/${{ github.repository }}/releases/latest/download/moms-games.apk
